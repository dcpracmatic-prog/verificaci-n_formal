name: Extraer proyecto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: |
          unzip -q verificacion_formal.zip -d /tmp/proyecto
          cp -a /tmp/proyecto/verificacion-formal/. .
          rm verificacion_formal.zip

      - name: Publicar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar proyecto de verificación formal"
          git push
