name: Verificadores externos — Z3 y CBMC

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "obligations/**"
      - "proofs/**"
      - "upstream/**"
      - ".github/workflows/formal-solvers.yml"

permissions:
  contents: read

jobs:
  z3:
    name: Obligaciones SMT-LIB con Z3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar Z3
        run: |
          sudo apt-get update
          sudo apt-get install --yes z3
      - name: Ejecutar obligaciones SMT
        run: |
          set +e
          sh obligations/run_z3.sh > z3.log 2>&1
          rc=$?
          cat z3.log
          { echo '### Resultado Z3'; echo '```'; cat z3.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  cbmc:
    name: Arneses C con CBMC
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Instalar CBMC y GCC
        run: |
          sudo apt-get update
          sudo apt-get install --yes cbmc gcc
      - name: Ejecutar verificación acotada
        shell: bash
        env:
          CBMC_TIMEOUT: "240"
        run: |
          set +e
          bash obligations/run_cbmc.sh > cbmc.log 2>&1
          rc=$?
          cat cbmc.log
          { echo '### Resultado CBMC'; echo '```'; cat cbmc.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
