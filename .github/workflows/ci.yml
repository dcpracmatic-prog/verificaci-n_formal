name: CI — pruebas y regresión

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python, C, sanitizers y regresión exhaustiva
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar compilador C
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc

      - name: Ejecutar pruebas unitarias
        run: python -m unittest discover -s tests -v

      - name: Ejecutar verificación integrada
        run: python run_all.py

      - name: Publicar certificado y resumen como artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-verification-report
          path: |
            report/certificate.json
            report/RESUMEN.md
          if-no-files-found: warn
          retention-days: 30
